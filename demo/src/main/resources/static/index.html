<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>WebSocket Chat</h2>
<input type="text" id="message" placeholder="Type a message..." />
<button onclick="sendData()">Send</button>
<text id="ip">TBD</text>
<ul id="messages"></ul>

<script>
    const username = prompt("Please enter your username:");
    
    var socket;
    var stompClient;
    var ip;

    var screenDict = {};
    var toSend = {};
    toSend["username"] = username;
    toSend["windowCenterX"] = 1500;
    toSend["windowCenterY"] = 1100;
    toSend["windowWidth"] = window.innerWidth;
    toSend["windowHeight"] = window.innerHeight;
    

    start();

    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            return 'err';
        }
    }

    async function start() {
        ip = await getIP();
        var totalPath = ip+"/"+username;
        toSend["totalPath"] = totalPath;
        socket = new SockJS('/data');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function () {
            document.getElementById('ip').textContent = "/server/"+totalPath;
            stompClient.subscribe('/server/'+totalPath, function (message) {

                var msg = JSON.parse(message.body);
                screenDict = msg;

                var li = document.createElement("li");
                li.appendChild(document.createTextNode(msg.hello));
                document.getElementById("messages").appendChild(li);

                sendData();
            })
            stompClient.send("/app/ip", {}, JSON.stringify(totalPath));
        })
    }
    
    function sendData() {
        stompClient.send("/app/data", {}, JSON.stringify(toSend));
        document.getElementById("message").value = "";
    }
    

</script>
</body>
</html>
